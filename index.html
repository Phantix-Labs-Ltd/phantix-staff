<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("phantix_theme");
          var dark;
          if (stored === "light") dark = false;
          else if (stored === "system")
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          else dark = true; // "dark" or unset -> dark (historical default)
          if (dark) document.documentElement.removeAttribute("data-theme");
          else document.documentElement.setAttribute("data-theme", "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#000000" : "#F4F6FA");
        } catch (e) { /* ignore */ }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2338" />

    <!-- Primary SEO (internal console — indexed for brand, gated in practice) -->
    <title>SecureGraph Staff Portal — Internal Admin &amp; Support Console | Phantix Labs</title>
    <meta
      name="description"
      content="Phantix Labs Staff Portal: internal admin, support, and superadmin console for managing tenants, discovery, compliance, analytics and operations for the SecureGraph platform."
    />
    <meta name="keywords" content="phantix, phantix labs, phantix staff, phantixlabs, phantom labs, phantix admin" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://staff.phantixlabs.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to use SecureGraph Staff Portal.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
