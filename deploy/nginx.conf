# staff-portal single-app container (nginx).
# /api is reverse-proxied to ${API_PROXY_TARGET} (required), keeping the API
# session cookie first-party on this app's own hostname.
map $http_x_forwarded_proto $phantix_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
map $uri $app_cache_control {
    default     "public, max-age=0, must-revalidate";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/static/  "public, max-age=31536000, immutable";
    ~^/fonts/   "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), display-capture=()" always;
    add_header Cache-Control $app_cache_control always;

    client_max_body_size 200m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $phantix_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass ${API_PROXY_TARGET};
    }

    # Staff portal also proxies the public sandbox-apply form (same backend).
    location = /sandbox-apply {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $phantix_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass ${API_PROXY_TARGET};
    }
    location /sandbox-apply/ {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Proto $phantix_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass ${API_PROXY_TARGET};
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
